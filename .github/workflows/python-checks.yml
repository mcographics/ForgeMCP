name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' -c requirements-lock.txt
      - run: python -m pytest tests -q
      - run: python -m ruff check server tests
